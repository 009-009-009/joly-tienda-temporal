        // Carrito:
        // id del producto -> cantidad de cajas
        const carrito = {};
        let pedidoConfirmado = null;

        function formatoPrecio(valor) {
            return "$" + valor.toLocaleString("es-CL");
        }

        function crearTarjetas() {

    productosTemporada.forEach(producto => {

        const contenedor = document.getElementById(
            "productos-" + producto.familia
        );

        const tarjeta = document.createElement("div");
        tarjeta.className = "producto";

        tarjeta.innerHTML = `
        <img src="${producto.imagen || ""}" alt="${producto.nombre}">
        <h3>${producto.nombre}</h3>

        <p class="presentacion">
            ${producto.presentacion}
        </p>

        <p class="precio">
            ${formatoPrecio(producto.precioCaja)}
        </p>

        <p class="referencia">
            Referencia: ${formatoPrecio(producto.precioUnidad)} c/u
        </p>

        <button
            id="boton-${producto.id}"
            onclick="agregarProducto('${producto.id}')">
            Agregar al pedido
        </button>
    `;

        contenedor.appendChild(tarjeta);
    });
}

        function agregarProducto(id) {

  

    if (!carrito[id]) {
        carrito[id] = 0;
    }

    carrito[id]++;

    actualizarProducto(id);
    mostrarPedido();
}

        function quitarProducto(id) {

            if (!carrito[id] || carrito[id] <= 0) {
                return;
            }

            carrito[id]--;
            

            if (carrito[id] === 0) {
                delete carrito[id];
            }

            actualizarProducto(id);
            mostrarPedido();
        }

      function actualizarProducto(id) {

   
    const boton = document.getElementById("boton-" + id);

    

    if (carrito[id]) {
        boton.textContent =
            "✓ Agregado · " + carrito[id];
    } else {
        boton.textContent = "Agregar al pedido";
    }

    boton.disabled = false;
}

     function mostrarPedido() {

    const lista = document.getElementById("listaPedido");

    lista.innerHTML = "";

    const ids = Object.keys(carrito);

    if (ids.length === 0) {

        lista.innerHTML =
            '<p class="vacio">Tu pedido está vacío.</p>';

        document.getElementById("total").textContent =
            "Total: $0";

        return;
    }

    let total = 0;

    ids.forEach(id => {

        const producto = productosTemporada.find(p => p.id === id);
        const cantidad = carrito[id];

        const subtotal = producto.precioCaja * cantidad;
        total += subtotal;

        const item = document.createElement("div");
        item.className = "item-pedido";

        item.innerHTML = `
        <div>
            <strong>${producto.nombre}</strong><br>
            ${formatoPrecio(producto.precioCaja)} por caja
        </div>

        <div class="controles">

            <button onclick="quitarProducto('${producto.id}')">
                −
            </button>

            <span class="cantidad">
                ${cantidad}
            </span>

            <button onclick="agregarProducto('${producto.id}')">
                +
            </button>

        </div>

        <div>
            ${formatoPrecio(subtotal)}
        </div>
    `;

        lista.appendChild(item);
    });

    document.getElementById("total").textContent =
        "Total: " + formatoPrecio(total);
}
     function cancelarPedido() {

    const ids = Object.keys(carrito);

    if (ids.length === 0) {
        alert("No hay ningún pedido para cancelar.");
        return;
    }

    const confirmar = confirm(
        "¿Estás segura de que deseas cancelar el pedido?"
    );

    if (!confirmar) {
        return;
    }

    for (const id of ids) {
        delete carrito[id];
